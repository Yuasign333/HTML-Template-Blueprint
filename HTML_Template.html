<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <title>Blueprint Template</title>
</head>
<body style="font-family: 'Poppins', sans-serif; line-height:1.8; max-width:900px; margin:40px auto; background-color:#fafafa; text-align:center; padding:0 20px;">

    <!-- Title changed from raw blue to a sharp deep charcoal/slate for high readability -->
    <h1 style="color:#1e293b;">Page Title</h1>

    <!-- STEP 1: Build the form - every input needs a unique id -->
    <!-- Added a very subtle border and soft shadow to make the form container pop from the background -->
    <form style="background-color:#ffffff; padding:30px; border-radius:12px; max-width:600px; margin:0 auto; text-align:center; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);" onsubmit="return doTheWork()">
        
        <!-- Section label using a sophisticated deep indigo/slate hybrid -->
        <h3 style="color:#4338ca;">Section Label</h3>

        <!-- Text input example: added standard sleek border and padding -->
        <label for="inputA" style="color:#334155;"><b>Label: </b></label>
        <input type="text" id="inputA" style="width:50%; padding:8px; border:1px solid #cbd5e1; border-radius:6px;" required>
        <br><br>

        <!-- Number input example -->
        <label for="inputB" style="color:#334155;"><b>Number: </b></label>
        <input type="number" id="inputB" style="width:50%; padding:8px; border:1px solid #cbd5e1; border-radius:6px;" required>
        <br><br>

        <!-- Radio group example (name groups them, id is per choice) -->
        <span style="color:#334155;">
            <input type="radio" name="opt" id="optA" value="1" required> Choice 1<br>
            <input type="radio" name="opt" id="optB" value="2"> Choice 2<br>
        </span>
        <br>

        <!-- Checkbox example -->
        <span style="color:#334155;">
            <input type="checkbox" id="checkA"> Optional thing<br>
        </span>
        <br>

        <!-- Dropdown example -->
        <select id="dropA" style="padding:8px; border:1px solid #cbd5e1; border-radius:6px; color:#334155;">
            <option value="10">Option 1 - 10</option>
            <option value="20">Option 2 - 20</option>
        </select>
        <br><br>
        <hr style="border:0; border-top:1px solid #e2e8f0;">
        <br>

        <!-- Submit button: Vibrant tech violet/indigo for primary action -->
        <input type="submit" value="Submit" style="background-color:#6366f1; color:white; padding:10px 15px; border:none; border-radius:6px; width:49%; cursor:pointer; font-weight:600;">
        
        <!-- Clear button: Subdued cool gray for secondary action -->
        <input type="reset" value="Clear" onclick="document.getElementById('display').innerHTML=''" style="background-color:#94a3b8; color:white; padding:10px 15px; border:none; border-radius:6px; width:49%; cursor:pointer; font-weight:600;">
    </form>

    <!-- STEP 2: output box - its id is what JS will target -->
    <div id="display" style="max-width:600px; margin:20px auto; font-size:1.2em;"></div>

    <script>
    function doTheWork() {
        // STEP 3: pull values out using the SAME ids from the HTML
        var a = document.getElementById("inputA").value;
        var b = parseInt(document.getElementById("inputB").value);

        // reading a radio: check which one is .checked
        var choice = "";
        if (document.getElementById("optA").checked) {
            choice = "1";
        } else if (document.getElementById("optB").checked) {
            choice = "2";
        }

        // reading a checkbox
        var isChecked = document.getElementById("checkA").checked;

        // reading a dropdown
        var dropVal = document.getElementById("dropA").value;

        // STEP 4: validate 
        // Error color changed to a modern, less muddy crimson/rose red (#f43f5e)
        if (isNaN(b) || b < 0) {
            document.getElementById("display").innerHTML = "<p style='color:#f43f5e;'><b>Invalid input.</b></p>";
            return false;
        }

        // STEP 5: do the logic (loops/if-else go here)
        var result = a + " / " + b + " / choice:" + choice;

        // STEP 6: print to the SAME id as the output box
        // Success text matches the brand's sophisticated primary deep slate/indigo
        document.getElementById("display").innerHTML = "<p style='color:#4338ca;'><b>Result:</b> " + result + "</p>";

        // STEP 7: stop the page from reloading
        return false;
    }
    </script>
</body>
</html>
